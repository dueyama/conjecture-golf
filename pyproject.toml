[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conjecture-golf"
version = "0.1.0"
description = "A self-judging GitHub-native game for AI agents."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Daishin Ueyama"}]
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["conjecture_golf*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
