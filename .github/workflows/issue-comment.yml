name: Conjecture Golf issue command

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  handle-cg-command:
    if: ${{ github.event.issue.pull_request == null && !contains(github.event.comment.user.login, '[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve arena route
        id: route
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_LABELS_JSON: ${{ toJson(github.event.issue.labels.*.name) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          issue_number = os.environ["ISSUE_NUMBER"]
          labels = set(json.loads(os.environ.get("ISSUE_LABELS_JSON") or "[]"))
          season_archive_url = "https://github.com/dueyama/conjecture-golf/blob/main/seasons/season_2_summary.md"

          route = {
              "status": "closed",
              "rules_ref": "main",
              "season_spec": "",
              "canonical_branch": "arena/season-2",
              "quarantine_branch": "quarantine/season-2",
              "message": "Conjecture Golf is closed. No further moves are accepted.",
          }
          if issue_number == "1" or "season-0" in labels:
              route.update(
                  status="closed",
                  rules_ref="main",
                  canonical_branch="arena/season-0",
                  quarantine_branch="quarantine/season-0",
                  message="Season 0 is closed. No further moves are accepted for this Issue.",
              )
          elif issue_number == "2" or "season-1" in labels:
              route.update(
                  status="closed",
                  rules_ref="main",
                  season_spec="",
                  canonical_branch="arena/season-1",
                  quarantine_branch="quarantine/season-1",
                  message="Season 1 is closed. No further moves are accepted for this Issue. The Season 1 transcript remains archived on arena/season-1.",
              )
          elif issue_number == "3" or "season-2" in labels:
              route.update(
                  status="closed",
                  rules_ref="main",
                  season_spec="",
                  canonical_branch="arena/season-2",
                  quarantine_branch="quarantine/season-2",
                  message="Season 2 is closed. No further moves are accepted for this Issue.",
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in route.items():
                  print(f"{key}={value}", file=output)
              print(f"season_archive_url={season_archive_url}", file=output)
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.route.outputs.rules_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record fixed rules commit
        run: echo "CG_RULES_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Run fixed-rules smoke checks
        run: |
          if [ -n "${CG_SEASON_SPEC}" ]; then
            python -m conjecture_golf.season_spec lint "${CG_SEASON_SPEC}"
            python -m conjecture_golf.season_spec smoke "${CG_SEASON_SPEC}"
            python -m conjecture_golf.verify examples/conjectures/growth_true.json --season "${CG_SEASON_SPEC}" --pretty
            python -m conjecture_golf.replay examples/transcripts/basic.jsonl --season "${CG_SEASON_SPEC}" --season-scoring
          else
            python -m conjecture_golf.verify examples/conjectures/growth_true.json --pretty
            python -m conjecture_golf.replay examples/transcripts/basic.jsonl
          fi
        env:
          CG_SEASON_SPEC: ${{ steps.route.outputs.season_spec }}
      - name: Handle comment
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          COMMENT_CREATED_AT: ${{ github.event.comment.created_at }}
          COMMENT_ID: ${{ github.event.comment.id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          CG_MIN_PLAYER_INTERVAL_SECONDS: "21600"
          CG_SEASON_SCORING: "1"
          CG_ARENA_GATE: "1"
          CG_ARENA_STATUS: ${{ steps.route.outputs.status }}
          CG_ARENA_STATUS_MESSAGE: ${{ steps.route.outputs.message }}
          CG_SEASON_ARCHIVE_URL: ${{ steps.route.outputs.season_archive_url }}
          CG_RULES_REF: ${{ steps.route.outputs.rules_ref }}
          CG_SEASON_SPEC: ${{ steps.route.outputs.season_spec }}
          CG_REVEAL_POLICY: redacted
          CG_CANONICAL_BRANCH: ${{ steps.route.outputs.canonical_branch }}
          CG_QUARANTINE_BRANCH: ${{ steps.route.outputs.quarantine_branch }}
          CG_INVALID_STRIKES_TO_DISQUALIFY: "3"
          VERDICT_FILE: verdict.md
          CG_CANONICAL_TRANSCRIPT_FILE: arena-transcript.jsonl
          CG_QUARANTINE_TRANSCRIPT_FILE: quarantine-transcript.jsonl
          CG_ARENA_DECISION_FILE: arena-routing.json
          CG_BRANCH_STORE_DIR: arena-branch-store
        run: python -m conjecture_golf.github_issue_handler
      - name: Post verdict
        if: always() && hashFiles('verdict.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body-file verdict.md
      - name: Upload routing artifacts
        if: always() && hashFiles('arena-routing.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: conjecture-golf-routing-${{ github.event.issue.number }}-${{ github.event.comment.id }}
          path: |
            arena-routing.json
            arena-transcript.jsonl
            quarantine-transcript.jsonl
            arena-branch-store
