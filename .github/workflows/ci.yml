name: Conjecture Golf CI

on:
  push:
    branches-ignore:
      - "arena/**"
      - "quarantine/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: python -m pytest -q
      - name: Run required smoke commands
        run: |
          python -m conjecture_golf.demo
          python -m conjecture_golf.verify examples/conjectures/growth_true.json --pretty
          python -m conjecture_golf.replay examples/transcripts/basic.jsonl
